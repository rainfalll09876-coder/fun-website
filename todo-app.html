<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: #333;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 0.95rem;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    #todoInput {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    #todoInput:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-add {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .filter-btn:hover {
      border-color: #667eea;
    }

    .stats {
      display: flex;
      gap: 15px;
      justify-content: space-around;
      margin-bottom: 25px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #666;
      margin-top: 5px;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #f9f9f9;
      border-radius: 10px;
      margin-bottom: 10px;
      transition: all 0.3s;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .todo-item:hover {
      background: #f0f0f0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #333;
      word-break: break-word;
    }

    .priority-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-high {
      background: #ffebee;
      color: #c62828;
    }

    .priority-medium {
      background: #fff3e0;
      color: #e65100;
    }

    .priority-low {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-delete:hover {
      background: #ff5252;
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .clear-all {
      width: 100%;
      padding: 12px;
      background: #f5f5f5;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      color: #666;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      margin-top: 15px;
    }

    .clear-all:hover {
      background: #ffebee;
      border-color: #ff6b6b;
      color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .input-section {
        flex-direction: column;
      }

      .stats {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 My Tasks</h1>
      <p class="subtitle">Stay organized and productive</p>
    </header>

    <div class="input-section">
      <input
        type="text"
        id="todoInput"
        placeholder="Add a new task..."
        autocomplete="off"
      />
      <select id="prioritySelect" style="padding: 14px 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; cursor: pointer;">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="btn btn-add" id="addBtn">Add Task</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="activeCount">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="completedCount">0</div>
        <div class="stat-label">Completed</div>
      </div>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div id="emptyState" class="empty-state">
      <div class="empty-state-icon">✨</div>
      <p>No tasks yet. Add one to get started!</p>
    </div>

    <button class="clear-all" id="clearAll">Clear Completed Tasks</button>
  </div>

  <script>
    class TodoApp {
      constructor() {
        this.todos = JSON.parse(localStorage.getItem("todos")) || [];
        this.currentFilter = "all";
        this.init();
      }

      init() {
        this.cacheElements();
        this.attachEventListeners();
        this.render();
      }

      cacheElements() {
        this.todoInput = document.getElementById("todoInput");
        this.addBtn = document.getElementById("addBtn");
        this.todoList = document.getElementById("todoList");
        this.filterBtns = document.querySelectorAll(".filter-btn");
        this.emptyState = document.getElementById("emptyState");
        this.prioritySelect = document.getElementById("prioritySelect");
        this.totalCount = document.getElementById("totalCount");
        this.activeCount = document.getElementById("activeCount");
        this.completedCount = document.getElementById("completedCount");
        this.clearAllBtn = document.getElementById("clearAll");
      }

      attachEventListeners() {
        this.addBtn.addEventListener("click", () => this.addTodo());
        this.todoInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") this.addTodo();
        });
        this.filterBtns.forEach((btn) => {
          btn.addEventListener("click", () => this.setFilter(btn.dataset.filter));
        });
        this.clearAllBtn.addEventListener("click", () => this.clearCompleted());
      }

      addTodo() {
        const text = this.todoInput.value.trim();
        if (!text) return;

        const todo = {
          id: Date.now(),
          text,
          completed: false,
          priority: this.prioritySelect.value,
          createdAt: new Date().toLocaleString(),
        };

        this.todos.unshift(todo);
        this.save();
        this.todoInput.value = "";
        this.prioritySelect.value = "medium";
        this.render();
      }

      toggleTodo(id) {
        const todo = this.todos.find((t) => t.id === id);
        if (todo) {
          todo.completed = !todo.completed;
          this.save();
          this.render();
        }
      }

      deleteTodo(id) {
        this.todos = this.todos.filter((t) => t.id !== id);
        this.save();
        this.render();
      }

      clearCompleted() {
        const completedCount = this.todos.filter((t) => t.completed).length;
        if (completedCount === 0) return;

        if (confirm(`Delete ${completedCount} completed task(s)?`)) {
          this.todos = this.todos.filter((t) => !t.completed);
          this.save();
          this.render();
        }
      }

      setFilter(filter) {
        this.currentFilter = filter;
        this.filterBtns.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.filter === filter);
        });
        this.render();
      }

      getFilteredTodos() {
        switch (this.currentFilter) {
          case "active":
            return this.todos.filter((t) => !t.completed);
          case "completed":
            return this.todos.filter((t) => t.completed);
          default:
            return this.todos;
        }
      }

      updateStats() {
        const active = this.todos.filter((t) => !t.completed).length;
        const completed = this.todos.filter((t) => t.completed).length;
        this.totalCount.textContent = this.todos.length;
        this.activeCount.textContent = active;
        this.completedCount.textContent = completed;
      }

      render() {
        const filtered = this.getFilteredTodos();
        this.todoList.innerHTML = "";

        if (filtered.length === 0) {
          this.emptyState.style.display = "block";
        } else {
          this.emptyState.style.display = "none";
          filtered.forEach((todo) => {
            const li = document.createElement("li");
            li.className = `todo-item ${todo.completed ? "completed" : ""}`;
            li.innerHTML = `
              <input
                type="checkbox"
                class="checkbox"
                ${todo.completed ? "checked" : ""}
                onchange="app.toggleTodo(${todo.id})"
              />
              <span class="todo-text">${this.escapeHtml(todo.text)}</span>
              <span class="priority-badge priority-${todo.priority}">${todo.priority}</span>
              <button class="btn-delete" onclick="app.deleteTodo(${todo.id})">Delete</button>
            `;
            this.todoList.appendChild(li);
          });
        }

        this.updateStats();
      }

      save() {
        localStorage.setItem("todos", JSON.stringify(this.todos));
      }

      escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, (m) => map[m]);
      }
    }

    const app = new TodoApp();
  </script>
</body>
</html>
